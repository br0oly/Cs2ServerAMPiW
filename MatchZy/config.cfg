// ===================================================================
// AMPiW CDV 2026 - OFICJALNA KONFIGURACJA WTYCZKI MATCHZY
// ===================================================================

// ─── BRANDING I KOMUNIKATY CZATU ───────────────────────────────────
// Dostępne kolory: {Default}, {Red}, {LightRed}, {DarkRed}, {Green}, {Lime}, {Olive}, {Gold}, {Grey}, {Purple}, {Blue}
matchzy_chat_prefix "[{Green}AMPiW{Default} {Gold}CDV 2026{Default}]"
matchzy_admin_chat_prefix "[{Red}SĘDZIA{Default}]"

// Czytelność czatu - wyłączenie zbędnych powiadomień dla zachowania czystości ekranu
matchzy_print_damage_report 0       // Pokazuj podsumowanie obrażeń na koniec rundy (przydatne dla graczy)
matchzy_say_damage_command 0        // Zezwalaj na komendę .dmg / !dmg
matchzy_announce_ready_players 0    // Wyłączone (0) żeby nie spamować czatu gdy 10 osób klika ready - czysty ekran


// ─── ZASADY MECZOWE (MR12 / OVERTIME) ──────────────────────────────
matchzy_match_mode 1                // Włącza tryb meczowy (weryfikacja składów i gotowości)
matchzy_knife_round 1               // Włącza rundę nożową (na deciderze lub jeśli wymuszone)
matchzy_knife_round_winner_picks_team 1 // Wygrany nożówki decyduje o stronie (.stay / .switch)
matchzy_min_players_to_ready 5      // Wymagana liczba graczy w teamie do kliknięcia ready


// ─── ZARZĄDZANIE PAUZAMI ───────────────────────────────────────────
// Pauzy taktyczne
matchzy_tac_pause_max 4             // Maksymalnie 4 pauzy taktyczne na drużynę na całą mapę
matchzy_tac_pause_duration 30       // Każda pauza taktyczna trwa dokładnie 30 sekund

// Pauzy techniczne[cite: 3]
matchzy_tech_pause_duration 600     // Maksymalny czas pauzy technicznej (10 minut)[cite: 3]
matchzy_allow_tech_pause 1          // Zezwalaj graczom na użycie !tech w przypadku awarii pc/peryferiów


// ─── KOLEJKA PODŁĄCZANIA I REZERWOWI ───────────────────────────────
matchzy_kick_when_no_match_loaded 0 // Nie wyrzucaj graczy z serwera, jeśli nie załadowano jeszcze pliku JSON
matchzy_reset_cvars_on_match_end 1  // Przywraca bazowy server.cfg po zakończeniu oficjalnego meczu
matchzy_demo_path "MatchZy"         // Folder docelowy na dema wewnątrz katalogu csgo/


// ─── BEZPIECZEŃSTWO I LOGI ─────────────────────────────────────────
matchzy_everyone_is_admin 0         // Tylko osoby z pliku admins.json mają uprawnienia roota
matchzy_verbose 0                   // Wyłącza rozbudowany debug w konsoli (czyste logi, mniejsze obciążenie CPU)

